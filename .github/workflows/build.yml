name: Build SurgiQuiz

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/validate-learning-bridge.mjs
      - run: npm run build
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: surgiquiz-release-${{ github.sha }}
          path: |
            dist
            netlify
            netlify.toml
            package.json
            package-lock.json
            public
            src
            *.html
            vite.config.ts
            scripts/validate-learning-bridge.mjs
          retention-days: 1
