name: Build SurgiQuiz

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/ai-learning-anatomy]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
