name: Netlify Credential Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Netlify secret presence
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN GitHub Secret is missing"
            exit 1
          fi
          echo "NETLIFY_AUTH_TOKEN is configured"
      - run: npm install
      - run: node scripts/validate-learning-bridge.mjs
      - run: npm run build
